[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huli-ai"
version = "4.0.0a25"
description = "Huli 4 - assistente pessoal de IA local-first"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cryptography>=46,<47",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
voice = ["vosk==0.3.45", "sounddevice==0.5.3", "pocketsphinx>=5.1,<6"]
voice-whisper = ["faster-whisper==1.2.1"]
desktop = ["pystray==0.19.5", "Pillow>=11,<13"]
google-calendar = [
    "google-api-python-client>=2.184,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["huli*"]
exclude = ["data*", "tests*", "tools*", "scripts*", "docs*"]

[tool.setuptools.package-data]
"huli.voice" = ["resources/*.kws"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
