[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huli-ai"
version = "4.0.0a10"
description = "Huli 4 - assistente pessoal de IA local-first"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["huli*"]
exclude = ["data*", "tests*", "tools*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
